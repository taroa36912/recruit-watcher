name: Daily recruitment check

on:
  schedule:
    # GitHub ActionsはUTC。JST 08:15 = UTC 23:15（前日）
    - cron: "15 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create .env from GitHub Secrets
        run: |
          cat > .env <<'ENVEOF'
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL=deepseek-v4-pro
          DEEPSEEK_BASE_URL=https://api.deepseek.com
          GRADUATION_YEAR=2028
          DEEPSEEK_MAX_PAGE_CHARS=18000
          ENVEOF
      - name: Check all recruitment categories
        run: python src/checker.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "chore: update recruitment watch state"
          git push
