name: Daily recruitment check

on:
  schedule:
    # 日本時間 08:15 に毎日実行
    - cron: "15 8 * * *"
      timezone: "Asia/Tokyo"

  # GitHub上から手動実行するため（プロファイル／カテゴリを上書き可能）
  workflow_dispatch:
    inputs:
      profile:
        description: "実行プロファイル名（例: daily）"
        required: false
        default: "daily"
      categories:
        description: "カテゴリをカンマ区切りで上書き（例: quant,actuary）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from GitHub Secrets
        run: |
          cat > .env <<'ENVEOF'
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL=deepseek-v4-pro
          DEEPSEEK_BASE_URL=https://api.deepseek.com
          DEEPSEEK_ENABLED=true
          GRADUATION_YEAR=2028
          ENVEOF

      - name: Check recruitment categories
        env:
          PROFILE: ${{ inputs.profile || 'daily' }}
          CATEGORIES: ${{ inputs.categories }}
        run: |
          if [ -n "$CATEGORIES" ]; then
            python src/checker.py --category "$CATEGORIES"
          else
            python src/checker.py --profile "$PROFILE"
          fi

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update recruitment watch state"
            git push
          else
            echo "No state changes to commit."
          fi
